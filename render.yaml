services:
  # Backend Service
  - type: web
    name: health-monitoring-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: health-monitoring-db
          property: connectionString
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: MOCK_MODE
        value: false
        sync: false
      - key: FRONTEND_URL
        value: https://health-monitoring-frontend.onrender.com
    healthCheckPath: /docs

  # Frontend Service
  - type: web
    name: health-monitoring-frontend
    env: static
    buildCommand: npm install && npm run build
    publishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://health-monitoring-backend.onrender.com

  # PostgreSQL Database
  - type: pserv
    name: health-monitoring-db
    databaseName: health_monitoring
    user: health_monitoring_user
